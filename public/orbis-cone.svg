<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="coneGrad" x1="50" y1="10" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9500" />
      <stop offset="50%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#D63A00" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.85" />
    </linearGradient>
    <filter id="coneGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing outer circle -->
  <circle cx="50" cy="50" r="44" stroke="#FF7A00" stroke-width="2.5" stroke-dasharray="4 6" opacity="0.4" />

  <!-- Base ring -->
  <ellipse cx="50" cy="82" rx="36" ry="10" fill="#201510" opacity="0.8" />
  <ellipse cx="50" cy="80" rx="34" ry="8" fill="url(#coneGrad)" />
  
  <!-- Main Cone Body -->
  <path d="M 44 20 C 44 16 56 16 56 20 L 76 74 C 77 78 23 78 24 74 Z" fill="url(#coneGrad)" filter="url(#coneGlow)" />
  
  <!-- Top Cap Orb -->
  <circle cx="50" cy="18" r="7" fill="#FFA533" />
  <circle cx="48" cy="16" r="2.5" fill="#FFFFFF" opacity="0.8" />

  <!-- White curved reflective stripes (VLC heritage) -->
  <path d="M 39 42 C 45 44 55 44 61 42 L 64 51 C 56 54 44 54 36 51 Z" fill="url(#ringGrad)" />
  <path d="M 33 60 C 42 63 58 63 67 60 L 71 69 C 59 72 41 72 29 69 Z" fill="url(#ringGrad)" />

  <!-- Dynamic playback ring / orbit -->
  <ellipse cx="50" cy="50" rx="46" ry="18" transform="rotate(-25 50 50)" stroke="#FFB066" stroke-width="2" stroke-linecap="round" stroke-dasharray="120 40" opacity="0.7" />
  <circle cx="88" cy="34" r="3.5" fill="#FFFFFF" />
</svg>
