<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="orbisCoreGrad" x1="8" y1="6" x2="40" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9500" />
      <stop offset="60%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#D93800" />
    </linearGradient>
    <linearGradient id="orbisRingGrad" x1="4" y1="24" x2="44" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFAA4D" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FF7A00" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="stripeGrad" x1="16" y1="18" x2="32" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFF2E5" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Orbital Ring (Behind Cone) -->
  <path d="M 7 28 C 7 21 21 16 35 18 C 39 18.5 42 20 43 22" stroke="url(#orbisRingGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.45" />

  <!-- Modern Geometric Cone Body -->
  <path d="M 22.2 7.2 C 23.0 5.8 25.0 5.8 25.8 7.2 L 37.3 27.5 C 38.2 29.1 37.0 31.0 35.1 31.0 L 12.9 31.0 C 11.0 31.0 9.8 29.1 10.7 27.5 L 22.2 7.2 Z" fill="url(#orbisCoreGrad)" />

  <!-- Minimalist Curved Stripe -->
  <path d="M 18.5 17.5 C 22.0 18.6 26.0 18.6 29.5 17.5 L 31.8 21.5 C 27.0 23.0 21.0 23.0 16.2 21.5 Z" fill="url(#stripeGrad)" />

  <!-- Lower Subtle Stripe -->
  <path d="M 14.8 24.2 C 20.5 25.6 27.5 25.6 33.2 24.2 L 34.6 27.0 C 28.0 28.4 20.0 28.4 13.4 27.0 Z" fill="url(#stripeGrad)" opacity="0.9" />

  <!-- Base Curved Stand -->
  <rect x="10" y="32" width="28" height="3.5" rx="1.75" fill="url(#orbisCoreGrad)" />

  <!-- Orbital Ring (In Front of Cone) -->
  <path d="M 43 23 C 44 26 39 31 24 33 C 13 34.5 5 32.5 5 29" stroke="url(#orbisRingGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Glowing Orbit Satellite Node -->
  <circle cx="41.5" cy="22.5" r="3" fill="#FFFFFF" />
  <circle cx="41.5" cy="22.5" r="1.5" fill="#FF7A00" />
</svg>
